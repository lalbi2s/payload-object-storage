services:
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY: local-dev-access-key
      S3_SECRET_KEY: local-dev-secret-key
      S3_BUCKET: payload-files
    depends_on:
      - seaweedfs
    restart: on-failure

volumes:
  seaweedfs-data:
